- title: Selected Projects
  type: time_table
  contents:
    - title: Quantum Machine Learning for Enhancing MRI Screening
      institution: Joint work with Harvard Medical School and F. Hoffmann-La Roche AG
      year: September, 2023 - August, 2024
      description:
        - Part of Wellcome Leap Quantum for Bio Challenge - Phase 1
        - Applied various quantum machine learning techniques to improve MRI acquisition
    - title: Quantum Bayesian Neural Networks for Anomaly Detection
      institution: Joint work with Airbus
      year: November, 2023 - August, 2024
      description:
        - Applied Bayesian learning to Quantum Orthogonal Neural Networks for segmenting faults in 3D car parts
        - Used FNNs and 3D CNNs along with their Bayesian versions to find the optimal solution
        - Performed real hardware experiments to benchmark performance
    - title: Quantum Neural Networks for Credit Risk Assessment
      institution: Joint work with Itaú Unibanco
      year: September, 2022 - March, 2023
      description:
        - Designed neural networks for predicting credit risk from the bank's customer data
        - Matched classical performance with significantly fewer parameters using hybrid classical-quantum neural networks
        - Performed real hardware experiments to benchmark performance
    - title: Quantum Autoencoders for Anomaly Detection
      institution: Joint work with Airbus
      year: September, 2022 - March, 2023
      description:
        - Designed autoencoders using quantum orthogonal neural networks to detect anomalies in satellite images of ship routes
    - title: Quantum Vision Transformers for Medical Image Classification
      institution: Joint work with F. Hoffmann-La Roche AG
      year: April, 2022 - August, 2022
      description:
        - Developed both a quantum analogue and a quantum-native variant of the vision transformer
        - Used the developed techniques to classify Medical MNIST images
        - Performed real hardware experiments to benchmark performance
    - title: Quantum Convolutional Neural Networks for Surface Crack Detection
      institution: Joint work with BMW
      year: August, 2020 - June, 2021
      description:
        - Designed a convolutional neural network based on quantum orthogonal neural networks
        - Used the developed techniques to segment cracks on surface images
    - title: Quantum Orthogonal Neural Networks for Medical Image Classification
      institution: Joint work with F. Hoffmann-La Roche AG
      year: August, 2020 - June, 2021
      description:
        - Designed an orthogonal neural network architecture using quantum gates
        - Designed efficient learning algorithm to train the perfectly orthogonal neural networks
        - Extended it further to actual quantum architecture and benchmarked its performance
        - Used the developed techniques to classify Medical MNIST images
    - title: Numerical Key Rate Calculator for QKD Protocols
      institution: Part of Research Assistantship at IQC, UWaterloo
      year: April, 2020 - July, 2020
      description:
        - Contributed to the development of the software architecture and wrote protocols fitting into it
        - Wrote unified algorithms to perform parameter optimisation for various QKD protocols using numerical methods
        - Used High-Performance computing clusters of ComputeCanada to evaluate various QKD protocols' key rates
        - "Software available in the public domain at: https://openqkdsecurity.wordpress.com/"
    - title: Quantum Protocol Zoo
      institution: Part of Research Internship at LIP6, Paris
      year: December, 2018 - July, 2019
      description:
        - Added various protocols to the online encyclopedia of Quantum Internet Protocols and reviewed many others
        - Analysed and identified the resource requirements for performing each protocol
        - "Developed the 'Knowledge Graphs': a unified, interactive and user-friendly tool for resource visualisation"
        - "Available online at: wiki.veriqloud.fr"
    - title: Linear Cryptanalysis of Substitution-Permutation Network
      institution: Summer Project, IIT Roorkee
      year: May, 2018 - June, 2018
      description:
        - Learning project under Prof. Sugata Gangopadhyay, Dept. of CSE, IIT Roorkee
        - Implemented a Substitution-Permutation Network based Block Cipher model
        - Implemented a linear cryptanalytic attack on the developed cryptosystem for retrieval of certain key bits

